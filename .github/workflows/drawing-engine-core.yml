name: drawing-engine-core

on:
  push:
    paths:
      - 'runtime/drawing-engine-core.js'
      - 'runtime/drawing-engine-core.test.js'
      - 'runtime/drawing-source-router.js'
      - 'runtime/drawing-source-router.test.js'
      - 'runtime/drawing-reference-router.js'
      - 'runtime/drawing-reference-router.test.js'
      - 'runtime/drawing-task-contract.js'
      - 'runtime/drawing-task-contract.test.js'
      - 'runtime/drawing-prompt-compiler.js'
      - 'runtime/drawing-prompt-compiler.test.js'
      - 'runtime/svg-presentation-compositor.js'
      - 'runtime/svg-presentation-compositor.test.js'
      - 'tools/drawing_pdf_vector_adapter.py'
      - 'tools/drawing_pdf_vector_adapter.test.py'
      - 'tools/drawing_dxf_adapter.py'
      - 'tools/drawing_dxf_adapter.test.py'
      - 'tools/drawing_geometry_diff.py'
      - 'tools/drawing_geometry_diff.test.py'
      - 'tools/drawing_pdf_svg_exporter.py'
      - 'tools/drawing_pdf_svg_exporter.test.py'
      - 'tools/drawing_edge_diff.py'
      - 'tools/drawing_edge_diff.test.py'
      - 'tools/drawing_pdf_raster_overlay.py'
      - 'tools/drawing_pdf_raster_overlay.test.py'
      - 'tools/drawing_multiply_compositor.py'
      - 'tools/drawing_multiply_compositor.test.py'
      - 'tools/drawing_semantic_mapper.py'
      - 'tools/drawing_semantic_mapper.test.py'
      - 'tools/drawing_mask_manifest.py'
      - 'tools/drawing_mask_manifest.test.py'
      - 'DRAWING/**'
      - 'ROUTERS/DRAWING_ROUTER.md'
  pull_request:
    paths:
      - 'runtime/drawing-engine-core.js'
      - 'runtime/drawing-engine-core.test.js'
      - 'runtime/drawing-source-router.js'
      - 'runtime/drawing-source-router.test.js'
      - 'runtime/drawing-reference-router.js'
      - 'runtime/drawing-reference-router.test.js'
      - 'runtime/drawing-task-contract.js'
      - 'runtime/drawing-task-contract.test.js'
      - 'runtime/drawing-prompt-compiler.js'
      - 'runtime/drawing-prompt-compiler.test.js'
      - 'runtime/svg-presentation-compositor.js'
      - 'runtime/svg-presentation-compositor.test.js'
      - 'tools/drawing_pdf_vector_adapter.py'
      - 'tools/drawing_pdf_vector_adapter.test.py'
      - 'tools/drawing_dxf_adapter.py'
      - 'tools/drawing_dxf_adapter.test.py'
      - 'tools/drawing_geometry_diff.py'
      - 'tools/drawing_geometry_diff.test.py'
      - 'tools/drawing_pdf_svg_exporter.py'
      - 'tools/drawing_pdf_svg_exporter.test.py'
      - 'tools/drawing_edge_diff.py'
      - 'tools/drawing_edge_diff.test.py'
      - 'tools/drawing_pdf_raster_overlay.py'
      - 'tools/drawing_pdf_raster_overlay.test.py'
      - 'tools/drawing_multiply_compositor.py'
      - 'tools/drawing_multiply_compositor.test.py'
      - 'DRAWING/**'
      - 'ROUTERS/DRAWING_ROUTER.md'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf ezdxf pillow
      - run: node runtime/drawing-engine-core.test.js
      - run: node runtime/drawing-source-router.test.js
      - run: node runtime/drawing-reference-router.test.js
      - run: node runtime/drawing-task-contract.test.js
      - run: node runtime/drawing-prompt-compiler.test.js
      - run: node runtime/svg-presentation-compositor.test.js
      - run: python tools/drawing_pdf_vector_adapter.test.py
      - run: python tools/drawing_dxf_adapter.test.py
      - run: python tools/drawing_geometry_diff.test.py
      - run: python tools/drawing_pdf_svg_exporter.test.py
      - run: python tools/drawing_edge_diff.test.py
      - run: python tools/drawing_pdf_raster_overlay.test.py
      - run: python tools/drawing_multiply_compositor.test.py
      - run: python tools/drawing_semantic_mapper.test.py
      - run: python tools/drawing_mask_manifest.test.py
      - name: Validate drawing registries
        run: |
          node -e "for (const p of ['DRAWING/PRESENTATION_PRESET_REGISTRY.json','DRAWING/GENERATION_RECIPE_REGISTRY.json','DRAWING/EXTERNAL_TOOL_CAPABILITY_REGISTRY.json','DRAWING/PRESENTATION_MASK_CONTRACT.json','DRAWING/BENCHMARK_FIXTURE_CONTRACT.json','DRAWING/ACTUAL_FIXTURE_BASELINE_2026-09-23.json','DRAWING/OUTPUT_EVALUATION_CONTRACT.json','DRAWING/DXF_LAYER_SEMANTIC_RULES.example.json']) { JSON.parse(require('fs').readFileSync(p,'utf8')); console.log(p+' PASS'); }"
