name: drawing-engine-core

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf ezdxf pillow python-pptx openpyxl shapely

      - name: Run drawing JS tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for testfile in runtime/drawing-*.test.js; do
            if [ -f "$testfile" ]; then
              found=1
              echo "RUN $testfile"
              node "$testfile"
            fi
          done
          node runtime/svg-presentation-compositor.test.js
          test "$found" -eq 1

      - name: Run drawing Python tests
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for testfile in tools/drawing_*.test.py; do
            if [ -f "$testfile" ]; then
              found=1
              echo "RUN $testfile"
              python "$testfile"
            fi
          done
          test "$found" -eq 1

      - name: Validate all drawing JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("DRAWING").glob("*.json"))
          if not files:
              raise SystemExit("No DRAWING JSON contracts found")
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"{path} PASS")
          PY
