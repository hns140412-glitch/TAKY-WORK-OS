name: TAKY Enforcement Regression

on:
  push:
    branches:
      - surgery/enforcement-v1-2026-09-23
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - '.github/workflows/enforcement-regression.yml'

jobs:
  enforcement-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run enforcement regression
        run: node tests/enforcement-regression.test.js
