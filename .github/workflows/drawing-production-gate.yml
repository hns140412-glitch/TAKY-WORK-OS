name: Drawing Production Gate

on:
  push:
    branches:
      - taky/drawing-engine-v4-governed-production-2026-09-23
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  governed-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run drawing production regression suite
        run: node tests/drawing-production-gate.test.js
      - name: Verify no-pass-no-show contract is present
        run: |
          node - <<'NODE'
          const r=require('./runtime/drawing-production-router');
          const result=r.authorizeProduction({
            artifact_class:'FINAL',
            producer_type:'UNREGISTERED_SCRIPT',
            registered_engine:false,
            engine_available:true,
            bypass_used:true,
            gate_receipts:[]
          });
          if(result.ok || result.showable) process.exit(1);
          if(!result.findings.includes('ENGINE_AVAILABLE_BYPASS_USED_GOVERNANCE_FAILURE')) process.exit(2);
          console.log('no-pass-no-show contract: PASS');
          NODE
