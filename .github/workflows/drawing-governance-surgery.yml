name: Drawing Governance Surgery
on:
  push:
    branches:
      - taky/drawing-governance-surgery-2026-09-23
  pull_request:
    paths:
      - 'runtime/drawing-**'
      - 'tests/drawing-governance-surgery.test.js'
      - 'DRAWING/**'
      - 'C2S/**'
      - 'HANDOFF/**'
jobs:
  governance-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/drawing-governance-surgery.test.js
